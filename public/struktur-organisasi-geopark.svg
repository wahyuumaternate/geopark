    <circle cx="875"
            cy="1055"
            r="5"
            class="bullet"/>

    <text x="895"
          y="1063"
          class="box-text">
        Pemberdayaan dan
    </text>

    <text x="895"
          y="1092"
          class="box-text">
        Pendidikan
    </text>

    <text x="895"
          y="1121"
          class="box-text">
        Masyarakat
    </text>


    <circle cx="875"
            cy="1165"
            r="5"
            class="bullet"/>

    <text x="895"
          y="1173"
          class="box-text">
        Pengembangan
    </text>

    <text x="895"
          y="1202"
          class="box-text">
