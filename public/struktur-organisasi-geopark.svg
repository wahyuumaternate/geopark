
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="1650"
     viewBox="0 0 1200 1650">

    <defs>

        <style>
            .box {
                fill: #17A2B8;
                stroke: #168da0;
                stroke-width: 2;
            }

            .box-title {
                fill: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 25px;
                font-weight: 700;
                text-anchor: middle;
            }

            .box-text {
                fill: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 20px;
                font-weight: 600;
            }

            .line {
                stroke: #222222;
                stroke-width: 4;
                fill: none;
            }

            .bullet {
                fill: #ffffff;
            }
        </style>

        <marker id="arrowhead"
                markerWidth="12"
                markerHeight="12"
                refX="10"
                refY="6"
                orient="auto">

            <polygon points="0 0, 12 6, 0 12"
                     fill="#222222"/>

        </marker>

    </defs>


    <!-- ========================================================= -->
    <!-- DEWAN PENASEHAT -->
    <!-- ========================================================= -->

    <rect x="390"
          y="40"
          width="420"
          height="120"
          rx="35"
          class="box"/>

    <text x="600"
          y="112"
          class="box-title">
        DEWAN PENASEHAT
    </text>


    <!-- ========================================================= -->
    <!-- DEWAN PENASEHAT -> KETUA -->
    <!-- ========================================================= -->

    <line x1="600"
          y1="160"
          x2="600"
          y2="220"
          class="line"
          marker-end="url(#arrowhead)"/>


    <!-- ========================================================= -->
    <!-- KETUA BADAN PENGELOLA -->
    <!-- ========================================================= -->

    <rect x="390"
          y="225"
          width="420"
          height="135"
          rx="35"
          class="box"/>

    <text x="600"
          y="282"
          class="box-title">
