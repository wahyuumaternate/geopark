        Promosi dan Event
    </text>


    <!-- ========================================================= -->
    <!-- JALUR TENAGA AHLI -> KETUA BADAN PENGELOLA KAWASAN -->
    <!-- ========================================================= -->

    <!--
        Jalur dimulai dari bawah kotak Tenaga Ahli.
        Tidak melewati kotak.
    -->

  <!-- ========================================================= -->
<!-- KONEKTOR KOMISI TEKNIS / TENAGA AHLI / DIVISI -->
<!-- ========================================================= -->

<!-- Garis turun dari Ketua Harian -->
<line x1="600"
      y1="580"
      x2="600"
      y2="630"
      class="line"/>

<!-- Garis horizontal utama -->
<line x1="190"
      y1="630"
      x2="1010"
      y2="630"
      class="line"/>

<!-- Komisi Teknis -->
<line x1="190"
      y1="630"
      x2="190"
      y2="675"
      class="line"
      marker-end="url(#arrowhead)"/>

<!-- Tenaga Ahli -->
<line x1="600"
      y1="630"
      x2="600"
      y2="675"
      class="line"
      marker-end="url(#arrowhead)"/>

<!-- Divisi -->
<line x1="1010"
      y1="630"
      x2="1010"
      y2="675"
      class="line"
      marker-end="url(#arrowhead)"/>


<!-- ========================================================= -->
<!-- JALUR KE KETUA BADAN PENGELOLA KAWASAN -->
<!-- TITIK DI ANTARA KOMISI TEKNIS DAN TENAGA AHLI -->
<!-- ========================================================= -->

<!-- Titik tengah antara Komisi Teknis dan Tenaga Ahli -->
<line x1="375"
      y1="630"
      x2="375"
      y2="845"
      class="line"/>

<!-- Masuk ke Ketua Badan Pengelola Kawasan -->
<line x1="375"
      y1="845"
      x2="600"
      y2="845"
      class="line"/>

<line x1="600"
      y1="845"
      x2="600"
      y2="865"
      class="line"
      marker-end="url(#arrowhead)"/>

    <!-- ========================================================= -->
    <!-- KETUA BADAN PENGELOLA KAWASAN -->
    <!-- ========================================================= -->

    <rect x="390"
          y="865"
          width="420"
          height="150"
          rx="35"
          class="box"/>

    <text x="600"
          y="915"
          class="box-title">
        KETUA
    </text>

    <text x="600"
          y="950"
          class="box-title">
        BADAN PENGELOLA
    </text>

    <text x="600"
          y="985"
          class="box-title">
        KAWASAN
    </text>


    <!-- ========================================================= -->
    <!-- KETUA KAWASAN -> KETUA HARIAN KAWASAN -->
    <!-- ========================================================= -->

    <line x1="600"
          y1="1015"
          x2="600"
          y2="1060"
          class="line"
          marker-end="url(#arrowhead)"/>


    <!-- ========================================================= -->
    <!-- KETUA HARIAN KAWASAN -->
    <!-- ========================================================= -->

    <rect x="390"
          y="1070"
          width="420"
          height="125"
          rx="35"
          class="box"/>

    <text x="600"
          y="1122"
          class="box-title">
        KETUA HARIAN
    </text>

    <text x="600"
          y="1157"
          class="box-title">
        KAWASAN
    </text>


    <!-- ========================================================= -->
    <!-- KETUA HARIAN KAWASAN -> MANAJER GEOSITE -->
    <!-- ========================================================= -->

    <line x1="600"
          y1="1195"
          x2="600"
          y2="1240"
          class="line"
          marker-end="url(#arrowhead)"/>


    <!-- ========================================================= -->
    <!-- MANAJER GEOSITE -->
    <!-- ========================================================= -->

    <rect x="390"
          y="1250"
          width="420"
          height="125"
          rx="35"
          class="box"/>

    <text x="600"
          y="1325"
