    <text x="600"
          y="317"
          class="box-title">
        BADAN PENGELOLA
    </text>


    <!-- ========================================================= -->
    <!-- KETUA -> SEKRETARIS -->
    <!-- ========================================================= -->

    <path d="M 600 360
             L 600 405
             L 190 405
             L 190 455"
          class="line"
          marker-end="url(#arrowhead)"/>


    <!-- ========================================================= -->
    <!-- KETUA -> KETUA HARIAN -->
    <!-- ========================================================= -->

    <line x1="600"
          y1="360"
          x2="600"
          y2="455"
          class="line"
          marker-end="url(#arrowhead)"/>


    <!-- ========================================================= -->
    <!-- SEKRETARIS -->
    <!-- ========================================================= -->

    <rect x="25"
          y="460"
          width="330"
          height="120"
          rx="35"
          class="box"/>

    <text x="190"
          y="532"
