        SEKRETARIS
    </text>


    <!-- ========================================================= -->
    <!-- KETUA HARIAN -->
    <!-- ========================================================= -->

    <rect x="390"
          y="460"
          width="420"
          height="120"
          rx="35"
          class="box"/>

    <text x="600"
          y="532"
          class="box-title">
        KETUA HARIAN
    </text>


    <!-- ========================================================= -->
    <!-- KONEKTOR KE 3 BAGIAN -->
    <!-- ========================================================= -->

    <!-- Garis turun dari Ketua Harian -->
    <line x1="600"
          y1="580"
          x2="600"
          y2="630"
          class="line"/>


    <!-- Garis horizontal utama -->
    <line x1="190"
          y1="630"
          x2="1010"
          y2="630"
          class="line"/>


    <!-- ========================================================= -->
    <!-- KOMISI TEKNIS CONNECTOR -->
    <!-- ========================================================= -->

